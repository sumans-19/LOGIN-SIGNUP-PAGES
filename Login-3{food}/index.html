<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooking Website - Sign Up & Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: url('https://assets.bonappetit.com/photos/674090cc95b6e52b5f483023/4:3/w_2560%2Cc_limit/20241119_04_7%2520Fishes_Crab_Lobster_Scallops_018_WEB_V1.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-container {
            position: relative;
            width: 550px; /* Expanded horizontally */
            height: 550px;
            background: rgba(255, 255, 255, 0.15); /* Transparent glass effect */
            backdrop-filter: blur(10px); /* Adds a blur for elegance */
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .form-slider {
            display: flex;
            transition: transform 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55); /* Smooth bounce animation */
            width: 200%;
        }

        .form-container {
            width: 50%;
            padding: 2.5rem;
            box-sizing: border-box;
        }

        .form-container h2 {
            font-size: 2rem; /* Slightly larger title */
            color: #e63946;
            font-weight: bold;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .btn-custom {
            background: #e63946;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-custom:hover {
            transform: scale(1.05);
            box-shadow: 0px 5px 15px rgba(230, 57, 70, 0.5);
        }

        .toggle-buttons {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        .toggle-buttons button {
            background: none;
            border: none;
            font-size: 1rem;
            color: #e63946;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .toggle-buttons button:hover {
            color: #d62839;
            transform: scale(1.1);
        }

        .form-container input {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #ccc;
            border-radius: 5px;
            height: 40px;
            margin-bottom: 1rem;
            padding: 0 10px;
        }

        .form-container input:focus {
            border-color: #e63946;
            box-shadow: 0px 0px 5px #e63946;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="form-slider" id="form-slider">
            <!-- Sign Up Form -->
            <div class="form-container">
                <h2>Sign Up</h2>
                <form>
                    <div class="mb-3">
                        <label for="signup-name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="signup-name" placeholder="Enter your full name">
                    </div>
                    <div class="mb-3">
                        <label for="signup-email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="signup-email" placeholder="Enter your email">
                    </div>
                    <div class="mb-3">
                        <label for="signup-password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="signup-password" placeholder="Create a password">
                    </div>
                    <button type="submit" class="btn btn-custom w-100">Sign Up</button>
                </form>
                <div class="toggle-buttons">
                    <button onclick="showLogin()">Already have an account? Login</button>
                </div>
            </div>
            <!-- Login Form -->
            <div class="form-container">
                <h2>Login</h2>
                <form>
                    <div class="mb-3">
                        <label for="login-email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="login-email" placeholder="Enter your email">
                    </div>
                    <div class="mb-3">
                        <label for="login-password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="login-password" placeholder="Enter your password">
                    </div>
                    <button type="submit" class="btn btn-custom w-100">Login</button>
                </form>
                <div class="toggle-buttons">
                    <button onclick="showSignUp()">Don’t have an account? Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const formSlider = document.getElementById('form-slider');

        function showLogin() {
            formSlider.style.transform = 'translateX(-50%)';
        }

        function showSignUp() {
            formSlider.style.transform = 'translateX(0)';
        }
    </script>
</body>
</html>
