<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicology Kit - Login & Signup Portal</title>
  <link href="./styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-cover bg-no-repeat">
  <div class="flex flex-row min-h-screen">
    <!-- Left Side with Transparent Image -->
    <div class="w-1/4 flex items-center justify-center bg-transparent">
      <img src="medical-removebg-preview.png" alt="Medical Illustration" class="max-h-full opacity-80">
    </div>

    <!-- Center with Heading and Boxes -->
    <div class="w-2/4 flex flex-col items-center justify-center space-y-16">
      <!-- Heading -->
      <h1 class="text-4xl font-extrabold text-blue-900 animated-heading">
        Welcome to Medicology Kit, Your Medical Learning Hub!
      </h1>

      <div class="flex space-x-12">
        <!-- Login Box -->
        <div class="w-80 p-8 bg-white shadow-lg rounded-lg hover:shadow-2xl transition-shadow duration-500 hover:glitter-effect">
          <h2 class="text-2xl font-bold text-blue-600 flex items-center">
            <img src="https://img.icons8.com/ios-filled/50/000000/stethoscope.png" class="w-6 h-6 mr-2"/> Login
          </h2>
          <form class="mt-4">
            <input type="text" placeholder="Email" class="w-full px-4 py-2 border border-blue-300 rounded-lg mb-3 focus:border-blue-500 focus:ring focus:ring-blue-200 transition duration-200"/>
            <input type="password" placeholder="Password" class="w-full px-4 py-2 border border-blue-300 rounded-lg mb-3 focus:border-blue-500 focus:ring focus:ring-blue-200 transition duration-200"/>
            <button class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition duration-300">Login</button>
          </form>
        </div>

        <!-- Signup Box -->
        <div class="w-80 p-8 bg-white shadow-lg rounded-lg hover:shadow-2xl transition-shadow duration-500 hover:glitter-effect">
          <h2 class="text-2xl font-bold text-blue-600 flex items-center">
            <img src="https://img.icons8.com/ios-filled/50/000000/hospital.png" class="w-6 h-6 mr-2"/> Signup
          </h2>
          <form class="mt-4">
            <input type="text" placeholder="Full Name" class="w-full px-4 py-2 border border-blue-300 rounded-lg mb-3 focus:border-blue-500 focus:ring focus:ring-blue-200 transition duration-200"/>
            <input type="text" placeholder="Email" class="w-full px-4 py-2 border border-blue-300 rounded-lg mb-3 focus:border-blue-500 focus:ring focus:ring-blue-200 transition duration-200"/>
            <input type="password" placeholder="Password" class="w-full px-4 py-2 border border-blue-300 rounded-lg mb-3 focus:border-blue-500 focus:ring focus:ring-blue-200 transition duration-200"/>
            <button class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition duration-300">Sign Up</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Right Side with Transparent Image -->
    <div class="w-1/4 flex items-center justify-center bg-transparent">
      <img src="medical-removebg-preview.png" alt="Medical Illustration" class="max-h-full opacity-80">
    </div>
  </div>
</body>
</html>
