<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup/Login Form</title>
    <link rel="stylesheet" href="loginstyle.css">
</head>
<body>
    <div class="form-container">
        <div class="welcome-message">
            <h1>Welcome to Our ShopMart!</h1>
            <p>To enjoy shopping, please Signup/Login below..</p>
        </div>

        <div class="form-box">
            <h3 id="formTitle" style="color: azure;">Signup!</h3>
            <form id="signupForm">
                <input type="text" placeholder="Username" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="btn">Signup</button>
                <p class="switch-text">Already have an account? <span id="toggleLogin">Login!</span></p>
            </form>
            <form id="loginForm" style="display: none;">
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="btn">Login</button>
                <p class="switch-text">Don't have an account? <span id="toggleSignup">Signup!</span></p>
            </form>
        </div>
    </div>
    <script src="loginscript.js"></script>
</body>
</html>
